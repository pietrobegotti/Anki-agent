[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-agent"
version = "0.1.0"
description = "AI agent for managing an Anki collection through AnkiConnect"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
anki-agent = "anki_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
